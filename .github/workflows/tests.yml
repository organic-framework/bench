name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      # each action pinned by its commit (v4.4.0, v5.6.0: what the tags v4 and v5 named when pinned), not by a tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      # the reader is checked on every runtime it takes: Lua 5.4, Lua 5.5, LuaJIT and Lua 5.1; a test that finds none
      # fails
      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends lua5.4 luajit lua5.1
      # Ubuntu 24.04 has no Lua 5.5: it is built from the Lua team's repository at the commit of its tag v5.5.1 (the
      # hash is the check of what is built), as one plain interpreter, without that repository's test library
      - name: Build Lua 5.5
        run: |
          git init -q "$RUNNER_TEMP/lua55" && cd "$RUNNER_TEMP/lua55"
          git fetch -q --depth 1 https://github.com/lua/lua 7579fc9d7ed90240487251dfb69168f8e64e9294
          git checkout -q FETCH_HEAD
          cc -std=c99 -O2 -DLUA_USE_LINUX -DMAKE_LUA -o lua5.5 onelua.c -lm -ldl
          sudo install -m 755 lua5.5 /usr/local/bin/lua5.5
          lua5.5 -v
      # the outer layer every evaluation runs in (docs/bench.md): bwrap, which Ubuntu 24.04's AppArmor keeps from
      # making user namespaces until this is lifted; in CI its tests must run, never skip
      - name: Install bwrap
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit suite
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          BENCH_STATE: ${{ runner.temp }}/bench-state
        run: PYTHONPATH=bin python3 -m unittest -v tests.test_bench
